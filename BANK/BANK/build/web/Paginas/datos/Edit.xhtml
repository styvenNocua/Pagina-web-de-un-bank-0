<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditDatosTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditDatosLabel_id}" for="id" />
                    <h:inputText id="id" value="#{datosController.selected.id}" title="#{bundle.EditDatosTitle_id}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_nombre}" for="nombre" />
                    <h:inputText id="nombre" value="#{datosController.selected.nombre}" title="#{bundle.EditDatosTitle_nombre}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_nombre}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_apellidos}" for="apellidos" />
                    <h:inputText id="apellidos" value="#{datosController.selected.apellidos}" title="#{bundle.EditDatosTitle_apellidos}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_apellidos}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_tipoDeDocumento}" for="tipoDeDocumento" />
                    <h:inputText id="tipoDeDocumento" value="#{datosController.selected.tipoDeDocumento}" title="#{bundle.EditDatosTitle_tipoDeDocumento}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_tipoDeDocumento}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_numeroDeDocumento}" for="numeroDeDocumento" />
                    <h:inputText id="numeroDeDocumento" value="#{datosController.selected.numeroDeDocumento}" title="#{bundle.EditDatosTitle_numeroDeDocumento}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_numeroDeDocumento}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_ocupacion}" for="ocupacion" />
                    <h:inputText id="ocupacion" value="#{datosController.selected.ocupacion}" title="#{bundle.EditDatosTitle_ocupacion}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_ocupacion}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_departamento}" for="departamento" />
                    <h:inputText id="departamento" value="#{datosController.selected.departamento}" title="#{bundle.EditDatosTitle_departamento}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_departamento}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_ciudad}" for="ciudad" />
                    <h:inputText id="ciudad" value="#{datosController.selected.ciudad}" title="#{bundle.EditDatosTitle_ciudad}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_ciudad}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_edad}" for="edad" />
                    <h:inputText id="edad" value="#{datosController.selected.edad}" title="#{bundle.EditDatosTitle_edad}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_edad}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_fchaDeSolicitud}" for="fchaDeSolicitud" />
                    <h:inputText id="fchaDeSolicitud" value="#{datosController.selected.fchaDeSolicitud}" title="#{bundle.EditDatosTitle_fchaDeSolicitud}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_fchaDeSolicitud}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_direccion}" for="direccion" />
                    <h:inputText id="direccion" value="#{datosController.selected.direccion}" title="#{bundle.EditDatosTitle_direccion}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_direccion}"/>
                    <h:outputLabel value="#{bundle.EditDatosLabel_telefono}" for="telefono" />
                    <h:inputText id="telefono" value="#{datosController.selected.telefono}" title="#{bundle.EditDatosTitle_telefono}" required="true" requiredMessage="#{bundle.EditDatosRequiredMessage_telefono}"/>
                </h:panelGrid>
                <h:commandLink action="#{datosController.update}" value="#{bundle.EditDatosSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditDatosViewLink}"/>
                <br />
                <h:commandLink action="#{datosController.prepareList}" value="#{bundle.EditDatosShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditDatosIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
