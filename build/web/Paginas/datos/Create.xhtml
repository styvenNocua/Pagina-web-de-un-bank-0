<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateDatosTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateDatosLabel_id}" for="id" />
                    <h:inputText id="id" value="#{datosController.selected.id}" title="#{bundle.CreateDatosTitle_id}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_nombre}" for="nombre" />
                    <h:inputText id="nombre" value="#{datosController.selected.nombre}" title="#{bundle.CreateDatosTitle_nombre}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_nombre}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_apellidos}" for="apellidos" />
                    <h:inputText id="apellidos" value="#{datosController.selected.apellidos}" title="#{bundle.CreateDatosTitle_apellidos}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_apellidos}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_tipoDeDocumento}" for="tipoDeDocumento" />
                    <h:inputText id="tipoDeDocumento" value="#{datosController.selected.tipoDeDocumento}" title="#{bundle.CreateDatosTitle_tipoDeDocumento}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_tipoDeDocumento}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_numeroDeDocumento}" for="numeroDeDocumento" />
                    <h:inputText id="numeroDeDocumento" value="#{datosController.selected.numeroDeDocumento}" title="#{bundle.CreateDatosTitle_numeroDeDocumento}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_numeroDeDocumento}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_ocupacion}" for="ocupacion" />
                    <h:inputText id="ocupacion" value="#{datosController.selected.ocupacion}" title="#{bundle.CreateDatosTitle_ocupacion}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_ocupacion}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_departamento}" for="departamento" />
                    <h:inputText id="departamento" value="#{datosController.selected.departamento}" title="#{bundle.CreateDatosTitle_departamento}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_departamento}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_ciudad}" for="ciudad" />
                    <h:inputText id="ciudad" value="#{datosController.selected.ciudad}" title="#{bundle.CreateDatosTitle_ciudad}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_ciudad}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_edad}" for="edad" />
                    <h:inputText id="edad" value="#{datosController.selected.edad}" title="#{bundle.CreateDatosTitle_edad}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_edad}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_fchaDeSolicitud}" for="fchaDeSolicitud" />
                    <h:inputText id="fchaDeSolicitud" value="#{datosController.selected.fchaDeSolicitud}" title="#{bundle.CreateDatosTitle_fchaDeSolicitud}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_fchaDeSolicitud}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_direccion}" for="direccion" />
                    <h:inputText id="direccion" value="#{datosController.selected.direccion}" title="#{bundle.CreateDatosTitle_direccion}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_direccion}"/>
                    <h:outputLabel value="#{bundle.CreateDatosLabel_telefono}" for="telefono" />
                    <h:inputText id="telefono" value="#{datosController.selected.telefono}" title="#{bundle.CreateDatosTitle_telefono}" required="true" requiredMessage="#{bundle.CreateDatosRequiredMessage_telefono}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{datosController.create}" value="#{bundle.CreateDatosSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{datosController.prepareList}" value="#{bundle.CreateDatosShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateDatosIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
